# Arcom Play · instalação completa (servidor + banco PostgreSQL)
# Uso: copie .env.example para .env, preencha as senhas e rode:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arcomplay
      POSTGRES_USER: arcom
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    volumes:
      - dados-arcomplay:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcom -d arcomplay"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://arcom:${DB_PASSWORD}@db:5432/arcomplay
      ADMIN_USER: ${ADMIN_USER:?defina ADMIN_USER no arquivo .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no arquivo .env}
      PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"
volumes:
  dados-arcomplay:
